<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#ffb81c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="24" fill="url(#bgGrad)" />

  <!-- Decorative Orbs -->
  <circle cx="1100" cy="60" r="140" fill="#fb8500" opacity="0.25" filter="url(#glow)" />
  <circle cx="100" cy="240" r="120" fill="#3b82f6" opacity="0.3" filter="url(#glow)" />
  <circle cx="750" cy="200" r="90" fill="#ffd60a" opacity="0.15" />

  <!-- Left Content -->
  <!-- Pill Badge -->
  <rect x="60" y="45" width="230" height="34" rx="17" fill="#fb8500" fill-opacity="0.2" stroke="#fb8500" stroke-width="1.5" />
  <text x="75" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffb81c" letter-spacing="0.5">
    ⭐ PRO SERVICE PROVIDERS
  </text>

  <!-- Main Headline -->
  <text x="60" y="125" font-family="'Lora', Georgia, serif" font-size="36" font-weight="800" fill="#ffffff">
    Become a Verified Pro — Boost Your Bookings!
  </text>

  <!-- Subtitle -->
  <text x="60" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#cbd5e1" font-weight="400">
    Join 5,000+ top pest control, plumbers, electricians, AC techs &amp; cleaners across 22+ cities.
  </text>
  <text x="60" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" font-weight="500">
    ⚡ 100% Free Ads • Direct WhatsApp &amp; Phone Inquiries • Verified Badge
  </text>

  <!-- Right Visual / Badges -->
  <g transform="translate(850, 45)">
    <!-- Pro Card Mockup -->
    <rect x="0" y="0" width="280" height="190" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="1.5" />
    <!-- Avatar circle -->
    <circle cx="50" cy="50" r="28" fill="#fb8500" />
    <text x="38" y="58" font-family="system-ui, sans-serif" font-size="24">👨‍🔧</text>
    <!-- Pro Info -->
    <text x="90" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Verified Partner</text>
    <text x="90" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#ffb81c">★★★★★ 4.9 (120+ jobs)</text>
    
    <!-- Badges inside card -->
    <rect x="20" y="95" width="115" height="28" rx="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
    <text x="30" y="113" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80">✓ ID Verified</text>
    
    <rect x="145" y="95" width="115" height="28" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
    <text x="155" y="113" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#60a5fa">⚡ Instant Calls</text>

    <!-- Card Button -->
    <rect x="20" y="135" width="240" height="38" rx="10" fill="url(#accentGrad)" />
    <text x="70" y="159" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
      Register Now Free →
    </text>
  </g>
</svg>
