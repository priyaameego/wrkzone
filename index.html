<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var key = 'wrzon:theme';
        var pref = 'light';
        try { pref = localStorage.getItem(key) || 'light'; } catch (e) { }
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Wrkzon - Build a CV. Get found. Apply smarter. | CV Maker &amp; Jobs</title>
    <meta name="description" content="Professional CV Maker, live jobs, and Job Agent early access — free tools for seekers and employers. Wrkzon." />
    <meta name="keywords" content="CV maker, resume builder, job search, Job Agent, AI job matching, JSON Resume, Easy Apply, public profile, Wrkzon" />
    <meta name="author" content="Wrkzon" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body class="bg-white dark:bg-[#121212] text-[#1a1a1a] dark:text-[#f3f4f6] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
